name: Setup JVM
description: >-
  Installs a JDK with actions/setup-java and, for Gradle builds, configures
  gradle/actions/setup-gradle (wrapper validation + Gradle User Home cache).
  For Maven builds the local repository is cached by setup-java.
author: AZapata27

inputs:
  java-version:
    description: JDK version to install (any value accepted by actions/setup-java, e.g. '21', '21.0.5', '25').
    required: false
    default: '21'
  distribution:
    description: JDK distribution (temurin, corretto, zulu, graalvm, ...).
    required: false
    default: temurin
  build-tool:
    description: "Build tool to prepare: 'gradle', 'maven' or 'none' (JDK only)."
    required: false
    default: none
  working-directory:
    description: Directory of the project, relative to the workspace. Used to scope the Maven cache key.
    required: false
    default: .
  gradle-cache-provider:
    description: >-
      setup-gradle cache implementation. 'basic' (default) is the open-source GitHub Actions cache;
      'enhanced' is the commercial gradle-actions-caching component (accept its terms first);
      'external' disables Gradle User Home caching.
    required: false
    default: basic

outputs:
  java-version:
    description: Exact JDK version installed.
    value: ${{ steps.java.outputs.version }}
  java-home:
    description: Path of the installed JDK.
    value: ${{ steps.java.outputs.path }}
  gradle-version:
    description: Gradle version detected by setup-gradle (empty for non-Gradle builds).
    value: ${{ steps.gradle.outputs.gradle-version }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        BUILD_TOOL: ${{ inputs.build-tool }}
      run: |
        case "${BUILD_TOOL}" in
          gradle|maven|none) ;;
          *) echo "::error title=setup-jvm::build-tool must be 'gradle', 'maven' or 'none' (got '${BUILD_TOOL}')"; exit 1 ;;
        esac

    - name: Set up JDK
      id: java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: ${{ inputs.build-tool == 'maven' && 'maven' || '' }}
        cache-dependency-path: ${{ inputs.build-tool == 'maven' && format('{0}/**/pom.xml', inputs.working-directory) || '' }}

    - name: Set up Gradle
      id: gradle
      if: inputs.build-tool == 'gradle'
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: ${{ inputs.gradle-cache-provider }}
        add-job-summary: on-failure
