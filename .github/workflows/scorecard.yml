# OpenSSF Scorecard for THIS repository: scores supply-chain practices weekly, on every change
# to main and whenever branch protection changes; results go to code scanning and the public
# Scorecard API (badge in README.md).
#
# Not a reusable workflow on purpose: with publish_results: true the Scorecard API verifies the
# run's OIDC token against a workflow file that lives in the scored repository and follows the
# constraints below, which a `workflow_call` workflow cannot satisfy (see ADR 0003 and
# docs/usage.md, "OpenSSF Scorecard"). Constraints required by publish_results:
#   - no top-level env/defaults; no containers or services;
#   - only these actions in the job: harden-runner, checkout, scorecard-action, upload-artifact,
#     codeql-action/upload-sarif.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 1'          # weekly, Monday 05:41 UTC
  push:
    branches: [main]

permissions: {}                  # each job widens only what it needs (allowed by publish_results)

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read             # read workflow runs (Dangerous-Workflow, CI-Tests checks)
      security-events: write    # upload SARIF to code scanning
      id-token: write           # OIDC token to publish results to the Scorecard API
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
