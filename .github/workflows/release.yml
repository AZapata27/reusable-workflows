# Reusable workflow: release-please (Conventional Commits -> release PR, tag, GitHub Release, CHANGELOG)
# plus optional SLSA build provenance for an artifact built earlier in the caller's run.
#
#   jobs:
#     release:
#       uses: AZapata27/reusable-workflows/.github/workflows/release.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: write
#         issues: write
#         pull-requests: write
#         id-token: write        # only with artifact-name
#         attestations: write    # only with artifact-name
#       with:
#         release-type: simple
name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please release type (simple, java, maven, node, ...). Ignored when config-file is set.
        type: string
        default: simple
      config-file:
        description: Path to release-please-config.json (manifest mode). Empty = single-package mode driven by release-type.
        type: string
        default: ''
      manifest-file:
        description: Path to .release-please-manifest.json (manifest mode).
        type: string
        default: ''
      target-branch:
        description: Branch release-please works against (empty = the repository default branch).
        type: string
        default: ''
      artifact-name:
        description: >-
          Optional name of an artifact uploaded earlier in the same workflow run. When a release is created it is
          downloaded, a build provenance attestation is generated for its files and they are attached to the release.
        type: string
        default: ''
      artifact-subject-path:
        description: Glob (relative to the downloaded artifact directory) selecting the files to attest and attach.
        type: string
        default: '**'
      timeout-minutes:
        description: Timeout for each job in minutes.
        type: number
        default: 10
    secrets:
      release-token:
        description: >-
          Optional PAT / GitHub App token for release-please. Pull requests opened with the default GITHUB_TOKEN
          do not trigger other workflows (e.g. CI on the release PR); pass a token to change that.
        required: false
    outputs:
      release_created:
        description: "'true' when a release (tag + GitHub Release) was created in this run."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the created release (e.g. v1.2.3), empty otherwise.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of the created release (e.g. 1.2.3), empty otherwise.
        value: ${{ jobs.release-please.outputs.version }}

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write        # create tags, releases and the release branch
      issues: write          # manage the autorelease labels
      pull-requests: write   # open / update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.release-token || github.token }}
          release-type: ${{ inputs.config-file == '' && inputs.release-type || '' }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

  provenance:
    name: Attest and attach ${{ inputs.artifact-name }}
    needs: release-please
    if: inputs.artifact-name != '' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write        # upload release assets
      id-token: write        # Sigstore OIDC signing of the attestation
      attestations: write    # persist the attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/release-artifact

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-artifact/${{ inputs.artifact-subject-path }}

      - name: Attach files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          SUBJECT_GLOB: ${{ inputs.artifact-subject-path }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          cd "${ARTIFACT_DIR}"
          files=()
          # shellcheck disable=SC2206 # intentional glob expansion of the subject pattern
          for f in ${SUBJECT_GLOB}; do
            [ -f "${f}" ] && files+=("${f}")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=release::No files matched '${SUBJECT_GLOB}' in artifact."
            exit 1
          fi
          gh release upload "${TAG_NAME}" "${files[@]}" --clobber
          {
            echo "### Release assets"
            echo ""
            echo "Attached to \`${TAG_NAME}\` with build provenance:"
            for f in "${files[@]}"; do echo "- \`${f}\`"; done
          } >> "${GITHUB_STEP_SUMMARY}"
